<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Sakshi Gangurde</title>
  <!-- GitHub Pages SPA routing fix -->
  <script type="text/javascript">
    const path = window.location.pathname.toLowerCase();
    // Redirect to SPA router if it looks like a valid route.
    const validRoutes = ['/about', '/case-study'];
    const isKnownRoute = validRoutes.some(route => path.startsWith(route));
    
    if (isKnownRoute) {
      const loc = window.location;
      const pathSegmentsToKeep = 0; // user site at username.github.io
      loc.replace(
        loc.protocol + '//' + loc.hostname + (loc.port ? ':' + loc.port : '') +
        loc.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        loc.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (loc.search ? '&' + loc.search.slice(1).replace(/&/g, '~and~') : '') +
        loc.hash
      );
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background: #0e0e0e;
      --foreground: #f5f5f5;
      --primary: #2dd4bf;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient animated background blobs matching the project's gradients */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      opacity: 0.3;
      animation: float 8s ease-in-out infinite alternate;
    }
    
    .blob-1 {
      width: 400px;
      height: 400px;
      background: #0ce6f2;
      top: -100px;
      left: -100px;
    }
    
    .blob-2 {
      width: 500px;
      height: 500px;
      background: #8b5cf6;
      bottom: -200px;
      right: -100px;
      animation-duration: 12s;
      animation-delay: -4s;
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
    }

    .error-code {
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #0ce6f2, #8b5cf6, #2dd4bf);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: shine 5s linear infinite;
    }

    .title {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 800;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .description {
      font-size: 1.125rem;
      color: #a3a3a3;
      max-width: 450px;
      margin: 0 auto 2.5rem auto;
      line-height: 1.6;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary);
      color: var(--background);
      font-weight: 600;
      font-size: 1rem;
      padding: 1rem 2rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(45, 212, 191, 0.2);
      border: 2px solid transparent;
    }

    .btn-home:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(45, 212, 191, 0.4);
      background-color: transparent;
      color: var(--primary);
      border-color: var(--primary);
    }
    
    .btn-home svg {
      margin-right: 8px;
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
    }
    
    .btn-home:hover svg {
      transform: translateX(-4px);
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(40px) scale(1.05); }
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  
  <div class="content">
    <div class="error-code">404</div>
    <h1 class="title">Lost in the digital void?</h1>
    <p class="description">
      Looks like you've ventured into uncharted territory. The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="/" class="btn-home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to Portfolio
    </a>
  </div>
</body>
</html>
